    <rect x="16" y="394" width="328" height="105" class="box"/>
    <text x="28" y="423" class="label">Climate Shield</text><text x="28" y="449" class="small">Team project · first place</text><text x="28" y="476" class="small">Repository / award announcement</text>
    <rect x="16" y="512" width="328" height="105" class="box"/>
