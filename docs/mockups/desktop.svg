    <text x="16" y="657" class="label">Publication</text><text x="16" y="682" class="small">Paper title, authors, venue, DOI</text>
    <text x="16" y="717" class="label">Patent</text><text x="16" y="742" class="small">Number and title</text>
    <text x="16" y="780" class="small">Contact / footer / source</text>
  </g>
  <g transform="translate(810,110)">
    <text y="0" class="label">03 / Interests (AI) — ai.html</text>
    <rect y="20" width="360" height="790" class="frame"/><rect y="20" width="360" height="4" class="accent"/>
    <text x="16" y="55" class="label">Chunzhang Liu.</text><text x="16" y="80" class="small">Home | Work &amp; Research | Interests (AI)</text>
    <line x1="0" y1="96" x2="360" y2="96" class="line"/>
    <text x="16" y="140" class="title">Engineering interests</text>
    <rect x="16" y="164" width="328" height="73" class="box"/>
    <text x="28" y="193" class="label">AI-generated page notice</text><text x="28" y="220" class="small">Grounded in supplied experience</text>
    <rect x="16" y="266" width="328" height="120" class="box"/>
    <text x="28" y="296" class="label">01 / Reliable backend systems</text><text x="28" y="326" class="small">Interest + related experience</text><text x="28" y="356" class="small">Question to explore</text>
    <rect x="16" y="402" width="328" height="120" class="box"/>
    <text x="28" y="432" class="label">02 / AI infrastructure</text><text x="28" y="462" class="small">Interest + related project link</text><text x="28" y="492" class="small">Question to explore</text>
    <rect x="16" y="538" width="328" height="120" class="box"/>
    <text x="28" y="568" class="label">03 / Autonomous systems</text><text x="28" y="598" class="small">Interest + DroneRanger link</text><text x="28" y="628" class="small">Question to explore</text>
    <text x="16" y="704" class="label">AI disclosure</text><text x="16" y="733" class="small">Link to detailed README disclosure</text>
    <text x="16" y="780" class="small">Footer / source / LinkedIn</text>
  </g>
  <text x="30" y="960">On smaller screens, columns stack vertically and navigation wraps. All pages share the same typography and colors.</text>
</svg>
