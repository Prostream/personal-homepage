    <text x="28" y="176" class="small">Role, focus, background</text>
    <rect x="28" y="216" width="118" height="34" class="accent"/>
    <text x="37" y="237" class="small white">Explore my work</text>
    <rect x="236" y="119" width="108" height="155" class="box"/>
    <text x="247" y="147" class="label">At a glance</text>
    <text x="247" y="177" class="small">Initials</text>
    <text x="247" y="201" class="small">Education</text>
    <text x="247" y="225" class="small">Graduation</text>
    <text x="16" y="314" class="label">Work experience</text>
    <rect x="16" y="330" width="328" height="65" class="box"/>
    <text x="28" y="358">Nokia</text><text x="130" y="358" class="small">Role, dates, contributions</text>
    <rect x="16" y="404" width="328" height="65" class="box"/>
    <text x="28" y="432">SPDB</text><text x="130" y="432" class="small">Role, dates, contributions</text>
    <text x="16" y="507" class="label">Interactive career journey</text>
    <rect x="16" y="523" width="328" height="32" class="box"/>
    <text x="25" y="544" class="small">Security | Banking | Study | Cloud</text>
    <rect x="16" y="555" width="328" height="67" class="box"/>
    <text x="28" y="586">Selected stage's story</text>
    <text x="16" y="659" class="label">Selected work</text>
    <rect x="16" y="674" width="100" height="55" class="box"/><rect x="130" y="674" width="100" height="55" class="box"/><rect x="244" y="674" width="100" height="55" class="box"/>
    <text x="22" y="707" class="small">DroneRanger</text><text x="134" y="707" class="small">Climate Shield</text><text x="258" y="707" class="small">LLM / K8s</text>
    <text x="16" y="765" class="small">Contact → email / LinkedIn</text>
    <text x="16" y="794" class="small">© Author | Site source</text>
  </g>
  <g transform="translate(420,110)">
    <text y="0" class="label">02 / Work &amp; Research — work.html</text>
    <rect y="20" width="360" height="790" class="frame"/><rect y="20" width="360" height="4" class="accent"/>
    <text x="16" y="55" class="label">Chunzhang Liu.</text><text x="16" y="80" class="small">Home | Work &amp; Research | Interests (AI)</text>
    <line x1="0" y1="96" x2="360" y2="96" class="line"/>
    <text x="16" y="140" class="title">Work &amp; Research</text><text x="16" y="170" class="small">Project overview and evidence links</text>
    <rect x="16" y="198" width="328" height="34" class="box"/>
    <text x="24" y="220" class="small">All | Robotics | Climate | AI infrastructure</text>
    <text x="16" y="255" class="small">Live result count</text>
    <rect x="16" y="276" width="328" height="105" class="box"/>
