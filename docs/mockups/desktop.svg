<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <title>Desktop wireframes for Home, Work and Research, and Interests</title>
  <desc>Three annotated low-fidelity page mockups showing shared navigation and the order of content.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#242424;font-size:16px}.title{font-size:24px;font-weight:bold}.label{font-weight:bold}.small{font-size:13px}.frame{fill:#fff;stroke:#9b9b9b}.box{fill:#f2f0eb;stroke:#c5c2bd}.line{stroke:#bcb8b2}.accent{fill:#a6192e}.white{fill:white}</style>
  <rect width="1200" height="1000" fill="#fdfcf9"/>
  <text x="30" y="42" class="title">Personal homepage — desktop wireframes</text>
  <text x="30" y="72">Low-fidelity content layout • shared header and footer • red = action / selected state</text>
  <g transform="translate(30,110)">
    <text y="0" class="label">01 / Home — index.html</text>
    <rect y="20" width="360" height="790" class="frame"/>
    <rect y="20" width="360" height="4" class="accent"/>
    <text x="16" y="55" class="label">Chunzhang Liu.</text>
    <text x="16" y="80" class="small">Home | Work &amp; Research | Interests (AI)</text>
    <line x1="0" y1="96" x2="360" y2="96" class="line"/>
    <rect x="16" y="119" width="207" height="155" class="box"/>
